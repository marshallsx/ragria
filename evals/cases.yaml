  as_of: 2023-06-01
  expected: answer
  expect_conditions: ["28"]
  expect_contains: "8 November 2023"
- id: E2  # undated query on a mapped condition -> current version + a history view
  category: Temporal
  question: What protections apply when a supplier installs a prepayment meter?
  expected: answer
  expect_conditions: ["28"]
  expect_version: "2025-08-01"
  expect_history: "text-change"
