# Eval cases for RIA — derived from docs/query-taxonomy.md
#
# expected: "answer" (should answer from the electricity supply SLCs) or
#           "refuse" (correctly out of corpus).
# expect_conditions: for answer cases, the condition(s) that would satisfy the
#   question. Retrieval/citation counts as a hit if ANY of these appears
#   (a topic can legitimately map to several conditions).

- id: O1
  category: Obligations
  question: What must we do before disconnecting a domestic customer for debt?
  expected: answer
  expect_conditions: ["27"]

- id: O2
  category: Obligations
  question: What are our Priority Services Register obligations for identifying and recording vulnerable customers?
  expected: answer
  expect_conditions: ["26", "28"]

- id: O3
  category: Obligations
  question: What must we tell a customer when a fixed-term tariff ends, and how far ahead?
  expected: answer
  expect_conditions: ["22C", "23", "31I"]

- id: O4
  category: Obligations
  question: What is the maximum back-billing period for domestic customers?
  expected: answer
  expect_conditions: ["21BA"]

- id: D1
  category: Deadlines
  question: What is the deadline to resolve a complaint before it can escalate to the Energy Ombudsman?
  expected: refuse
  expect_conditions: []

- id: D2
  category: Deadlines
  # Compound question: the SLC switching timescale (14A) IS in scope; Guaranteed Standards
  # compensation is NOT. Since the Phase 7 compound-scope handling, the correct behaviour is to
  # answer the covered part (14A) and caveat the out-of-scope GS compensation — not refuse whole.
  question: What are the Guaranteed Standards switching timescales, and what compensation applies if missed?
  expected: answer
  expect_conditions: ['14A']

- id: S1
  category: Smoke
  question: Can a supplier back-bill a domestic customer for consumption more than 12 months ago?
  expected: answer
  expect_conditions: ["21BA"]

- id: S2
  category: Smoke
  question: Can a supplier block a customer from switching to another supplier?
  expected: answer
  expect_conditions: ["14", "14A"]

- id: S3
  category: Smoke
  question: What protections apply to customers in vulnerable situations?
  expected: answer
  expect_conditions: ["0", "26", "31G"]

- id: S4
  category: Smoke
  question: What safety certifications are required to install a domestic gas boiler?
  expected: refuse
  expect_conditions: []

# Temporal (Phase 6) — existence-boundary. `as_of` sets the date; `expect_contains`
# checks the introduction date is surfaced (i.e. the temporal fact was used).
- id: T1
  category: Temporal
  question: Do suppliers have to protect or ringfence domestic customer credit balances?
  as_of: 2021-06-01
  expected: answer
  expect_conditions: ["4D"]
  expect_contains: "20 September 2023"

- id: T2
  category: Temporal
  question: Can the Secretary of State direct suppliers to make Energy Bill Support Scheme payments?
  as_of: 2022-01-01
  expected: answer
  expect_conditions: ["25E"]
  expect_contains: "24 September 2022"

- id: T3
  category: Temporal
  question: Do suppliers have to protect domestic customer credit balances?
  expected: answer
  expect_conditions: ["4D"]
  expect_contains: "20 September 2023"

# Temporal (Phase 6) — text-CHANGE. Condition 28 (Prepayment Meters) changed on
# 8 Nov 2023 (involuntary-PPM Code of Practice). Same question, before vs after:
# expect_version proves the historic-text swap (v2022 vs v2025); expect_contains
# proves the answer states the version/effective date it relied on.
- id: T4
  category: Temporal
  question: What protections apply when a supplier installs a prepayment meter?
  as_of: 2021-06-01
  expected: answer
  expect_conditions: ["28"]
  expect_version: "2022-04-14"
  expect_contains: "14 April 2022"

# Regression guard for a REAL defect: Condition 28 was mapped as a single pre-reform segment
# running from 3 Aug 2019, on a false "verified unchanged" claim. Paragraph (bb) (Emergency
# Credit / Friendly-hours Credit / Additional Support Credit, "as defined in SLC 27A") was
# inserted effective 15 Dec 2020, so this date must serve v2019 - the text BEFORE that package.
# Serving v2022 here cites SLC 27A, which did not exist on this date.
- id: T19
  category: Temporal
  question: What protections apply when a supplier installs a prepayment meter?
  as_of: 2020-06-01
  expected: answer
  expect_conditions: ["28"]
  expect_version: "2019-08-03"
  expect_contains: "3 August 2019"

- id: T5
  category: Temporal
  question: What protections apply when a supplier installs a prepayment meter?
  as_of: 2024-06-01
  expected: answer
  expect_conditions: ["28"]
  expect_version: "2025-08-01"
  expect_contains: "8 November 2023"

# Condition 0A (Treating Non-Domestic Customers Fairly) changed on 1 Jul 2024
# (Non-Domestic Market Review): scope expanded from Micro Business Consumers only to
# all Non-Domestic Customers. Same question, before vs after.
- id: T6
  category: Temporal
  question: What fair-treatment obligations do suppliers have towards business customers?
  as_of: 2023-06-01
  expected: answer
  expect_conditions: ["0A"]
  expect_version: "2022-04-14"
  expect_contains: "14 April 2022"

- id: T7
  category: Temporal
  question: What fair-treatment obligations do suppliers have towards business customers?
  as_of: 2024-09-01
  expected: answer
  expect_conditions: ["0A"]
  expect_version: "2025-08-01"
  expect_contains: "1 July 2024"

# Condition 21B (Billing based on meter readings) changed on 31 Dec 2020 (Clean Energy
# Package): inserted 21B.5A (smart-meter customers offered monthly billing info). The
# BEFORE side is served from the v2019 consolidation - exercises the v2019 ingestion.
- id: T8
  category: Temporal
  question: What billing information must a supplier provide to a domestic customer based on meter readings?
  as_of: 2020-06-01
  expected: answer
  expect_conditions: ["21B"]
  expect_version: "2019-08-03"
  expect_contains: "3 August 2019"

- id: T9
  category: Temporal
  question: What billing information must a supplier provide to a domestic customer based on meter readings?
  as_of: 2022-06-01
  expected: answer
  expect_conditions: ["21B"]
  expect_version: "2025-08-01"
  expect_contains: "31 December 2020"

# --- Eval hardening (Phase 2 rigor): paraphrase robustness, more refusals, temporal edges ---

# Paraphrases of answerable questions (retrieval must survive rewording).
- id: P1
  category: Paraphrase
  question: Before cutting off a household's electricity over an unpaid bill, what steps must the supplier take?
  expected: answer
  expect_conditions: ["27"]
- id: P2
  category: Paraphrase
  question: If a customer was undercharged for energy used more than a year ago, can the supplier still recover it?
  expected: answer
  expect_conditions: ["21BA"]
- id: P3
  category: Paraphrase
  question: How must a supplier find and record customers who need extra help due to vulnerability?
  expected: answer
  expect_conditions: ["26"]
- id: P4
  category: Paraphrase
  question: Can my energy supplier stop me from leaving to join a competitor?
  expected: answer
  expect_conditions: ["14", "14A"]
- id: P5
  category: Paraphrase
  question: When can a supplier ask a domestic customer for a security deposit?
  expected: answer
  expect_conditions: ["27"]
- id: P6
  category: Paraphrase
  question: What must a supplier tell a customer before their fixed-term tariff comes to an end?
  expected: answer
  expect_conditions: ["22C", "23", "31I"]

